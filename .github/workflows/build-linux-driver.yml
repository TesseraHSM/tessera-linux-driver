name: Build Linux driver

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential linux-headers-generic

      - name: Build kernel module
        run: |
          headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$headers"
          make KDIR="$headers" -j"$(nproc)"
          test -s tsra.ko
